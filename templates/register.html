
{% extends "base.html" %}
{% block title %}회원가입 - NOSE{% endblock %}
{% block content %}
<div class="form-box">
    <h1>회원가입</h1>
    <form method="POST">
        <input name="username" placeholder="아이디" required minlength="2">
        <input type="password" name="password" placeholder="비밀번호 (6자 이상)" required minlength="6">
        <button type="submit">가입하기</button>
    </form>
    <p>이미 계정이 있나요? <a href="{{ url_for('login') }}">로그인</a></p>
</div>
{% endblock %}
