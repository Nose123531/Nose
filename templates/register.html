
{% extends "base.html" %}
{% block title %}회원가입 | NOSE{% endblock %}
{% block content %}
<section class="form-box">
    <h1>CREATE ACCOUNT</h1>
    <form method="POST">
        <input name="username" placeholder="아이디 (3~20자)" required minlength="3" maxlength="20">
        <input name="password" type="password" placeholder="비밀번호 (8자 이상)" required minlength="8">
        <button type="submit">회원가입</button>
    </form>
    <p>이미 계정이 있나요? <a href="/login">로그인</a></p>
</section>
{% endblock %}
