
{% extends "base.html" %}
{% block title %}로그인 - NOSE{% endblock %}
{% block content %}
<div class="form-box">
    <h1>로그인</h1>
    <form method="POST">
        <input name="username" placeholder="아이디" required>
        <input type="password" name="password" placeholder="비밀번호" required>
        <button type="submit">로그인</button>
    </form>
    <p>계정이 없나요? <a href="{{ url_for('register') }}">회원가입</a></p>
</div>
{% endblock %}
